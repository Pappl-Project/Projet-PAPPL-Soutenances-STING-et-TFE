<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Spring MVC Project</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <link rel="stylesheet" th:href="@{/resources/bootstrap-css/bootstrap.min.css}" />
    
    <link rel="stylesheet" th:href="@{/resources/css/style.css}" />

</head>
<body>
    <div class="container mt-4"> <h1 th:text="${myMessage}">Loading message...</h1>
        
        <form th:action="@{/submit-form}" method="POST" class="mt-3">
            <div class="mb-3">
                <label for="usernameInput" class="form-label">Enter your name:</label>
                <input type="text" name="username" class="form-control" id="usernameInput" />
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <script th:src="@{/resources/bootstrap-js/bootstrap.bundle.min.js}"></script>
</body>
</html>
