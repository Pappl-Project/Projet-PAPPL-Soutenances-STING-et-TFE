<!DOCTYPE html>
<!-- 1. Added the Thymeleaf namespace (xmlns:th) -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" th:href="@{/resources/bootstrap-css/bootstrap.min.css}" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" th:href="@{/resources/css/login-style.css}" />


    </head>
    <body>

        <div class="login-card">
            <div class="login-header">

                <div class="system-title">
                    Gestion des Soutenances<br>STING & TFE
                </div>
            </div>

            <div class="card-body">
                <form id="login-form">

                    <div id="login-error" class="alert alert-danger d-flex align-items-center d-none" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2"></i>
                        <div>Identifiant ou mot de passe incorrect.</div>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label text-secondary fw-bold small">IDENTIFIANT / EMAIL</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="prenom.nom@ec-nantes.fr" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary fw-bold small">MOT DE PASSE</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-ecn">
                            SE CONNECTER
                        </button>
                    </div>
                </form>
            </div>

            <div class="footer-text">
                © 2026 École Centrale de Nantes<br>
                Direction des Études
            </div>
        </div>

        <script th:src="@{/resources/bootstrap-js/bootstrap.bundle.min.js}"></script>


        <!-- 6. The JavaScript for JWT Login (AJAX) -->
        <script th:inline="javascript">
            /*<![CDATA[*/

            // Wait for the document to be ready
            document.addEventListener("DOMContentLoaded", function () {

                const loginForm = document.getElementById("login-form");
                const loginError = document.getElementById("login-error");

                // 6.1. Define the login endpoint URL (using Thymeleaf for the path)
                // This resolves issues with the project name (e.g., /ProjetPAPPLStingTfe)
                const loginUrl = /*[[@{/api/auth/login}]]*/ '/api/auth/login';

                // 6.2. Define where to redirect on success
                const redirectUrl = /*[[@{/}]]*/ '/';

                // 6.3. Intercept the form submit
                loginForm.addEventListener("submit", function (event) {
                    // Prevents the page from reloading
                    event.preventDefault();

                    // Hide old errors
                    loginError.classList.add("d-none");

                    // 6.4. Get the form data
                    const formData = new FormData(loginForm);
                    const data = Object.fromEntries(formData.entries());

                    // 6.5. Send the POST request with AJAX (Fetch)
                    fetch(loginUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data) // Convert data to JSON
                    })
                            .then(response => {
                                // 6.6. If the response is not OK (e.g., 401 Unauthorized), throw an error
                                if (!response.ok) {
                                    throw new Error('Login failed');
                                }
                                // If it's OK, parse the JSON response
                                return response.json();
                            })
                            .then(result => {
                                // ----------------------------------------------------
                                // 6.7. IMPORTANT CHANGE! Save the token in a COOKIE
                                // ----------------------------------------------------
                                // (We assume 5 hours expiration, same as in JwtUtil)
                                const fiveHoursInSeconds = 5 * 60 * 60;
                                // We use path=/ so the cookie is sent on all pages
                                document.cookie = `jwtToken=${result.jwt}; path=/; max-age=${fiveHoursInSeconds}; SameSite=Strict`;

                                // 6.8. Redirect the user to the main page (now protected)
                                window.location.href = redirectUrl;
                            })
                            .catch(error => {
                                // 6.9. ERROR! Show the error message
                                console.error("Error during login:", error);
                                loginError.classList.remove("d-none");
                            });
                });
            });

            /*]]>*/
        </script>
    </body>
</html>
