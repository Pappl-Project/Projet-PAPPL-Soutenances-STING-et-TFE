# =============================================================================
# TEST CONFIGURATION FILE
# Location: src/test/resources/db.properties
# Purpose: Provides dummy values for Unit Tests and CI (GitHub Actions).
# =============================================================================

# --- JDBC Driver for Testing (Using H2 In-Memory Database) ---
# We use H2 instead of PostgreSQL for tests to avoid external dependencies.
db.driver=org.h2.Driver

# --- Student Database Configuration (Mock) ---
# "mem:testdb" creates a database in RAM. 
# "DB_CLOSE_DELAY=-1" keeps the DB alive while the JVM is running.
student.db.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
student.db.username=sa
student.db.password=

# --- User/Login Database Configuration (Mock) ---
user.db.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
user.db.username=sa
user.db.password=

# --- JWT Configuration (Test Secret) ---
# A dummy key used ONLY for generating tokens during tests.
# Must be at least 256 bits (32 chars) for HMAC-SHA algorithms.
jwt.secret=TestSecretKeyForUnitTestingOnly1234567890!

# --- JWT Expiration (Optional override for tests) ---
# Set to a valid duration (e.g., 1 hour)
jwt.expiration=3600000