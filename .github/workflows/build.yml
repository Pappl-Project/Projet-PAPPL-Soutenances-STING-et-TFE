name: Java CI with SonarCloud Analysis

on:
  push:
    branches:
      - '**' 
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para que SonarQube obtenga todo el historial

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' 
          distribution: 'temurin'
          cache: maven

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Pappl-Project_Projet-PAPPL-Soutenances-STING-et-TFE -Dsonar.organization=pappl-project -Dsonar.host.url=https://sonarcloud.io