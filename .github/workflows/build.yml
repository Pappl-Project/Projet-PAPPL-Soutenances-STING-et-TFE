## YAML Template.
name: Java CI with Maven (Build and Test)
#Activates when
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      
      - name: checkout code
        uses: actions/checkout@v4
        
      - name: setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Build with maven
        run: mvn clean install
---
